<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arithmetic operations</title>

    <!-- PyScript CSS -->
    <link rel="stylesheet" href="https://pyscript.net/releases/2024.1.1/core.css">
    <!-- This script tag bootstraps PyScript -->
    <script type="module" src="https://pyscript.net/releases/2024.1.1/core.js"></script>
</head>

<style>
    body {
        background-image: url(genshinimpactscenery1.png) center center/cover no-repeat;
    }

    h3 {
        font-family: 'Courier New';
        text-align: center;
        color: #9c9661;
        margin-top: 50px;
        background-color: black;
    }

    .box-1 {
        height: 200px;
        width: 1000px;
        background-color: rgb(75, 188, 151);
        border-radius: 5%;
        text-align: center;
        outline: 5px solid #9c9661;
        margin-left: 250px;

    }

    .box-2 {
        height: 200px;
        width: 1000px;
        background-color: rgb(227, 209, 68);
        border-radius: 5%;
        text-align: center;
        outline: 5px solid #9c9661;
        margin-left: 250px;

    }

    .box-3 {
        height: 200px;
        width: 1000px;
        background-color: rgb(165, 75, 188);
        border-radius: 5%;
        text-align: center;
        outline: 5px solid #9c9661;
        margin-left: 250px;

    }

    .box-4 {
        height: 200px;
        width: 1000px;
        background-color: rgb(75, 188, 81);
        border-radius: 5%;
        text-align: center;
        outline: 5px solid #9c9661;
        margin-left: 250px;


    }

    .box-5 {
        height: 200px;
        width: 1000px;
        background-color: rgb(75, 173, 188);
        border-radius: 5%;
        text-align: center;
        outline: 5px solid #9c9661;
        margin-left: 250px;


    }

    .box-6 {
        height: 200px;
        width: 1000px;
        background-color: rgb(188, 130, 75);
        border-radius: 5%;
        text-align: center;
        outline: 5px solid #9c9661;
        margin-left: 250px;


    }

    .box-7 {
        height: 200px;
        width: 1000px;
        background-color: rgb(75, 180, 188);
        border-radius: 5%;
        text-align: center;
        outline: 5px solid #9c9661;
        margin-left: 250px;

    }
</style>

<body>
    <h2 style="font-family: 'Courier New'; background-color: rgb(14, 11, 43); color: aliceblue;">Arithmetic Functions
        Showcase</h2><br>

    <!-- I. result 1: addition -->
    <div class="box-1">
        <h3>Addition</h3>
        <form>
            <input style="margin-top: 55px;" type="number" id="num1" placeholder="Enter the first number"><br>
            <input type="number" id="num2" placeholder="Enter the second number"><br>
            <Input type="button" py-dblclick="adding_numbers" value="Add">
            <div id="result1"> <py-script src="maindrill2.py"></py-script></div>
        </form>
    </div>
    <br>

    <!-- II. result 2: subtraction -->
    <div class="box-2">
        <h3>Subtraction</h3>
        <form>
            <input style="margin-top: 55px;" type="number" id="num3" placeholder="Enter the first number"><br>
            <input type="number" id="num4" placeholder="Enter the second number"><br>
            <Input type="button" py-dblclick="subtracting_numbers" value="Subtract">
            <div id="result2"> <py-script src="maindrill2.py"></py-script></div>
        </form>
    </div>
    <br>

    <!-- III. result 3: multiplication -->
    <div class="box-3">
        <h3>Multiplication</h3>
        <form>
            <input style="margin-top: 55px;" type="number" id="num5" placeholder="Enter the first number"><br>
            <input type="number" id="num6" placeholder="Enter the second number"><br>
            <Input type="button" py-dblclick="multiplying_numbers" value="Multiply">
            <div id="result3"> <py-script src="maindrill2.py"></py-script></div>
        </form>
    </div>
    <br>

    <!-- IV. result 4: exponentiation -->
    <div class="box-4">
        <h3>Exponentiation</h3>
        <form>
            <input style="margin-top: 55px;" type="number" id="num7" placeholder="Enter the first number"><br>
            <input type="number" id="num8" placeholder="Enter the second number"><br>
            <Input type="button" py-dblclick="exponentiating_numbers" value="Exponentiate">
            <div id="result4"> <py-script src="maindrill2.py"></py-script></div>
        </form>
    </div>
    <br>

    <!-- V. result 5: float division -->
    <div class="box-5">
        <h3>Division (In it's truest form.)</h3>
        <form>
            <input style="margin-top: 55px;" type="number" id="num9" placeholder="Enter the first number"><br>
            <input type="number" id="num10" placeholder="Enter the second number"><br>
            <Input type="button" py-dblclick="floatdividing_numbers" value="Divide (Float)">
            <div id="result5"> <py-script src="maindrill2.py"></py-script></div>
        </form>
    </div>
    <br>

    <!-- VI. result 6: floor division -->
    <div class="box-6">
        <h3>Division (In its rounded down form.)</h3>
        <form>
            <input style="margin-top: 55px;" type="number" id="num11" placeholder="Enter the first number"><br>
            <input type="number" id="num12" placeholder="Enter the second number"><br>
            <Input type="button" py-dblclick="floordividing_numbers" value="Divide (Floor)">
            <div id="result6"> <py-script src="maindrill2.py"></py-script></div>
        </form>
    </div>
    <br>

    <!-- VI. result 7: modulus (remainder) -->
    <div class="box-7">
        <h3>Modulus (A.K.A the Remainder)</h3>
        <form>
            <input style="margin-top: 55px;" type="number" id="num13" placeholder="Enter the first number"><br>
            <input type="number" id="num14" placeholder="Enter the second number"><br>
            <Input type="button" py-dblclick="gettingtheremainderof_numbers" value="Get the remainder">
            <div id="result7"> <py-script src="maindrill2.py"></py-script></div>
        </form>
    </div>
    <br>
</body>

</html>
